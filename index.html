<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBeat | Premium Music Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Dynamic Ambient Background -->
    <div class="background-anim">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div id="particles-container"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-wave-square"></i></div>
                <h2>PulseBeat</h2>
            </div>
            
            <div class="nav-section">
                <h3>DISCOVER</h3>
                <div class="language-filters" id="language-filters">
                    <button class="lang-btn active" data-lang="all">
                        <i class="fa-solid fa-globe"></i> All Music
                    </button>
                    <button class="lang-btn" data-lang="hindi">
                        <i class="fa-solid fa-music"></i> Hindi Hits
                    </button>
                    <button class="lang-btn" data-lang="malayalam">
                        <i class="fa-solid fa-music"></i> Malayalam
                    </button>
                    <button class="lang-btn" data-lang="tamil">
                        <i class="fa-solid fa-music"></i> Tamil Hits
                    </button>
                </div>
            </div>
            
            <div class="nav-section playlist-section">
                <h3>YOUR LIBRARY</h3>
                <div class="playlist-list" id="playlist-list">
                    <!-- Playlist items injected via JS -->
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar glass-panel">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Search for songs, artists, or podcasts...">
                </div>
                <div class="top-actions">
                    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                    <div class="user-profile">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="User">
                    </div>
                </div>
            </header>

            <!-- Player Showcase Area -->
            <div class="player-showcase glass-panel">
                <canvas id="visualizer"></canvas>
                
                <div class="showcase-content">
                    <div class="album-showcase">
                        <div class="album-art-wrapper" id="album-art-wrapper">
                            <div class="vinyl-record"></div>
                            <img id="album-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" alt="Album Art">
                            <div class="album-art-glow"></div>
                        </div>
                    </div>
                    
                    <div class="track-details">
                        <div class="track-badge" id="track-lang-badge">Mixed Categories</div>
                        <h1 id="track-title" class="track-title">Cybernetic Dreams</h1>
                        <p id="track-artist" class="track-artist">Neon Horizon</p>
                        <p id="track-album" class="track-album">Synthetic Soul EP</p>
                    </div>
                </div>
            </div>

            <!-- Bottom Control Bar -->
            <div class="control-bar glass-panel">
                <div class="now-playing-mini">
                    <img id="mini-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=500&auto=format&fit=crop" alt="">
                    <div class="mini-info">
                        <h4 id="mini-title" class="marquee">Cybernetic Dreams</h4>
                        <p id="mini-artist">Neon Horizon</p>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="main-controls">
                        <button class="icon-btn control-btn" id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                        <button class="icon-btn control-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="play-pause-btn" id="play-pause-btn">
                            <div class="play-pause-glow"></div>
                            <i class="fa-solid fa-play" id="play-icon"></i>
                        </button>
                        <button class="icon-btn control-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                        <button class="icon-btn control-btn" id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
                    </div>
                    <div class="progress-container">
                        <span id="current-time">0:00</span>
                        <div class="progress-bar-wrapper" id="progress-area">
                            <div class="progress-bar" id="progress-bar">
                                <div class="progress-glow"></div>
                                <div class="progress-head"></div>
                            </div>
                        </div>
                        <span id="total-time">0:00</span>
                    </div>
                </div>

                <div class="volume-container">
                    <button class="icon-btn volume-btn" id="mute-btn"><i class="fa-solid fa-volume-high" id="volume-icon"></i></button>
                    <div class="volume-slider-wrapper" id="volume-area">
                        <div class="volume-bar" id="volume-bar">
                            <div class="volume-head"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Mobile Navigation Toggle -->
        <button class="mobile-nav-toggle" id="mobile-nav-toggle">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
